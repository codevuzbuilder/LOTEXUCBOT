name: LOTEX SHOP 24/7 Bot

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalar
        run: |
          pip install --upgrade pip
          pip install aiogram python-dotenv

      - name: Handlers tekshiruvi
        run: |
          ls -la handlers/
          python -c "from handlers import admin_core, admin_content, admin_design; print('✅ handlers dan olindi')"

      - name: Botni 24/7 ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ BOT_TOKEN Secrets da topilmadi!"
            exit 1
          fi
          echo "Token topildi, uzunligi: ${#BOT_TOKEN}"
          echo "LOTEX SHOP ishga tushdi... 24/7"
          while true; do
            python main.py
            echo "Qayta yonmoqda... 10s"
            sleep 10
          done