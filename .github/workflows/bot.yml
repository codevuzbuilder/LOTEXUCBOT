name: LOTEX SHOP 24/7 Bot

on:
  push:
    branches: [ "main" ]
  schedule:
    # Har 6 soatda avtomatik qayta ishga tushadi (24/7 uchun)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 6 soatdan sal kam, 【entity-GitHub¦canonical_name=GitHub】 limiti

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalar
        run: |
          pip install --upgrade pip
          pip install aiogram python-dotenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Handlers dan import tekshiruvi
        run: |
          echo "Handlers papkasidan tekshirilyapti..."
          ls -la handlers/
          python -c "from handlers import admin_core, admin_content, admin_design; print('✅ 3 ta fayl ham handlers dan olindi')"

      - name: Botni 24/7 ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          echo "LOTEX SHOP ishga tushdi... 24/7"
          # To'xtab qolsa avtomatik qayta yoqadi
          while true; do
            python main.py
            echo "Bot to'xtadi, 10 sekunddan keyin qayta yonadi..."
            sleep 10
          done