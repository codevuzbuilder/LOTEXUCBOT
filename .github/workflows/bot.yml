name: Telegram Bot 24/7 / run-bot

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install aiogram python-dotenv || true
          echo "Fayllar ro'yxati:"
          ls -la

      - name: Botni ishga tushirish (auto-restart bilan)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Ishga tushyapti, papka: $(pwd)"
          while true; do
            echo "Starting main.py..."
            python main.py
            EXIT_CODE=$?
            echo "Bot to'xtadi, exit code: $EXIT_CODE. 5 soniyadan keyin qayta uriniladi..."
            sleep 5
          done
